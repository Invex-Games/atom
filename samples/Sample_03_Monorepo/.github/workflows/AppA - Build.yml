name: AppA - Build

on:
  push:
    branches: [ main ]
    paths:
      - src/AppA/**
      - src/Shared/**
      - global.json
      - Directory.Build.*
      - Directory.Packages.*
      - _atom/**
      - .github/workflows/**
      - .devops/workflows/**
  release:
    types: [ released ]
  workflow_dispatch:

permissions: { }

jobs:

  PackAppA:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'appa/v')
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: PackAppA
        id: PackAppA
        run: dotnet run --project _atom/Sample_03_Monorepo.csproj -- PackAppA --skip --headless
        env:
          product: AppA

